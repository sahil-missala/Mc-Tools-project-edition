<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="testest.css">

<link rel="stylesheet"
href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>

<body class="bg">
<main>
<!-- HEADER -->
<nav class="navbar navbar-expand-lg navbar-dark bglight d-flex justify-content-between">
  <a class="navbar-brand text-white main-head" href="#">MC TOOLS PROJECT</a>
  <a class="nav-link" href="https://joharsmp.info/"><img src="arrow_13911843.png" alt="" class="camimg"> <span>- JoharSMP</span><span class="sr-only">(current)</span></a>
</nav>

<!-- TITLE -->
<div class="container text-center mt-5">
  <h1 class="text-white main-head">Minecraft Utility Tools</h1>
  <p class="text-white main-head"></p>
  <p class="text-white main-head">JavaScript Based Tools for Minecraft</p>
  <p class="text-white main-head">More coming soon...</p>
</div>

<!-- TOOLS SECTION -->
<div class="container mt-5">
<div class="row">

<!-- CHUNKBASE -->
<div class="col-md-3">
<div class="status-box w-100 text-center">
<h3>Seed Map</h3>
<input class="form-control mb-2" id="seed" placeholder="Enter Seed">
<button class="butto text-white w-100" onclick="openChunkbase()">Open Map</button>
<p class="mt-2"></p>
</div>
</div>

<!-- SERVER STATUS -->
<div class="col-md-3">
<div class="status-box w-100 text-center">
<h3>Server Status</h3>
<input class="form-control mb-2" id="ip" placeholder="Server IP">
<button class="butto text-white w-100" onclick="checkServer()">Check</button>
<p id="status" class="mt-2"></p>
</div>
</div>

<!-- UUID -->
<div class="col-md-3">
<div class="status-box w-100 text-center">
<h3>UUID Finder</h3>
<input class="form-control mb-2" id="username" placeholder="Username">

<div class="text-left mb-2">
<input type="checkbox" id="cracked"> Offline/Cracked
</div>

<button class="butto text-white w-100" onclick="getUUID()">Find UUID</button>
<p id="uuid" class="mt-2"></p>
</div>
</div>

<!-- COORD -->
<div class="col-md-3">
<div class="status-box w-100 text-center">
<h3>Coord Converter</h3>
<input class="form-control mb-2" id="x" placeholder="Overworld X">
<input class="form-control mb-2" id="z" placeholder="Overworld Z">
<button class="butto text-white w-100" onclick="convertCoords()">Convert</button>
<p id="coords" class="mt-2"></p>
</div>
</div>

</div>
</div>
</main>
<!-- FOOTER -->
<footer class="bglight2 p-2">
        <div class="d-flex justify-content-between m-3 container-fluid">
          <div class="row d-flex justify-content-between align-items-center">
            <div class="col-12 col-lg-4">
              <img src="johar_smp_logo.png" alt="" class="footlogo mt-auto mb-auto">
            </div>
            <div class="col-12 col-lg-8 center">
              <p class="foo center">Created by Sahil Missala for University Course Work Project based of Javascript for joharsmp.info</p>
            </div>
          </div>  
        </div>
      </footer>
<script src="testest.js"></script>

</body>
</html>
