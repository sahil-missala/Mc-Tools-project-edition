<!DOCTYPE html>
<html>
<head>
  <title>Minecraft Tools Hub</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="testest.css">
</head>
<body>

<h1 class="title">⚒️ Minecraft Tools Hub</h1>

<div class="grid">

  <!-- Chunkbase -->
  <div class="box">
    <h2>Chunkbase Seed Map</h2>
    <input id="seed" placeholder="Enter seed">
    <button onclick="openChunkbase()">Open Map</button>
  </div>

  <!-- Server status -->
  <div class="box">
    <h2>Server Status</h2>
    <input id="ip" placeholder="play.server.com">
    <button onclick="checkServer()">Check</button>
    <p id="status"></p>
  </div>

  <!-- UUID finder -->
  <div class="box">
    <h2>UUID Finder</h2>
    <input id="username" placeholder="Minecraft username">

    <label class="toggle">
      <input type="checkbox" id="cracked">
      Cracked / Offline mode
    </label>

    <button onclick="getUUID()">Find UUID</button>
    <p id="uuid"></p>
  </div>

  <!-- Coord converter -->
  <div class="box">
    <h2>Coord Converter</h2>
    <input id="x" placeholder="Overworld X">
    <input id="z" placeholder="Overworld Z">
    <button onclick="convert()">Convert to Nether</button>
    <p id="coords"></p>
  </div>

</div>

<script src="testest.js"></script>
</body>
</html>
